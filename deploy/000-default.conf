<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/cloud_lab5/public

    <Directory /var/www/cloud_lab5/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cloud_lab5_error.log
    CustomLog ${APACHE_LOG_DIR}/cloud_lab5_access.log combined
</VirtualHost>
